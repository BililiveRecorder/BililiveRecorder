name: Build and Test

on:
  push:
    branches:
      - "**"
  pull_request:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-dotnet@v4

      - name: Run NUKE Build - Test (Debug)
        run: ./build.sh Test --configuration Debug --skip BuildWebUI
        if: runner.os == 'Linux'
      - name: Run NUKE Build - Test (Debug)
        run: ./build.ps1 Test --configuration Debug --skip BuildWebUI
        if: runner.os == 'Windows'

      - name: Run NUKE Build - Test (Release)
        run: ./build.sh Test --configuration Release --skip BuildWebUI
        if: runner.os == 'Linux'
      - name: Run NUKE Build - Test (Release)
        run: ./build.ps1 Test --configuration Release --skip BuildWebUI
        if: runner.os == 'Windows'

  build_wpf:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Restore Packages
        run: msbuild -t:restore /v:m BililiveRecorder.WPF/BililiveRecorder.WPF.csproj

      - name: Build WPF - Debug
        run: msbuild /nologo /v:m /p:Configuration="Debug" BililiveRecorder.WPF/BililiveRecorder.WPF.csproj
      - name: Build WPF - Release
        run: msbuild /nologo /v:m /p:Configuration="Release" BililiveRecorder.WPF/BililiveRecorder.WPF.csproj

      - name: Upload Artifacts - Debug
        uses: actions/upload-artifact@v4
        with:
          name: WPF-Debug
          path: BililiveRecorder.WPF/bin/Debug

      - name: Upload Artifacts - Release
        uses: actions/upload-artifact@v4
        with:
          name: WPF-Release
          path: BililiveRecorder.WPF/bin/Release

  build_cli:
    strategy:
      matrix:
        rid: [any, linux-arm, linux-arm64, linux-musl-arm64, linux-x64, linux-musl-x64, osx-x64, osx-arm64, win-x64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-dotnet@v4

      - name: Run NUKE Build - BuildWebUI
        run: ./build.sh BuildWebUI

      - name: Run NUKE Build - PublishCli (Debug)
        run: ./build.sh PublishCli --configuration Debug --runtime-identifier ${{ matrix.rid }} --skip BuildWebUI

      - name: Run NUKE Build - PublishCli (Release)
        run: ./build.sh PublishCli --configuration Release --runtime-identifier ${{ matrix.rid }} --skip BuildWebUI

      - name: Upload Artifacts - Debug
        uses: actions/upload-artifact@v4
        with:
          name: CLI-${{ matrix.rid }}-Debug
          path: output/cli/${{ matrix.rid }}/Debug
      - name: Upload Artifacts - Release
        uses: actions/upload-artifact@v4
        with:
          name: CLI-${{ matrix.rid }}-Release
          path: output/cli/${{ matrix.rid }}/Release

  build_docker:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=edge
            type=ref,event=branch
            type=ref,event=pr

      - name: Run NUKE Build - BuildWebUI
        run: ./build.sh BuildWebUI
      - name: Build CLI
        run: dotnet build -c Release -o ./BililiveRecorder.Cli/bin/docker_out BililiveRecorder.Cli/BililiveRecorder.Cli.csproj
      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.GitHubActions
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
